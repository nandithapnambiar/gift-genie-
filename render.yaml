services:
  - type: web
    name: gift-genie-api
    runtime: node
    buildCommand: npm install
    startCommand: npm run api
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: API_PORT
        value: 10000
    disk:
      name: gift-genie-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
